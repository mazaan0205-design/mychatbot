<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Strike // 5v5</title>
<style>
:root{--bg:#06080d;--panel:#0b1019;--line:#263246;--cyan:#4de7ff;--red:#ff5e69;--gold:#ffd166;--text:#eef6ff;--muted:#8291a7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#172334,#06080d 55%);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}#wrap{height:100vh;display:grid;place-items:center;padding:12px}.shell{position:relative;width:min(1280px,100%);height:min(820px,100%);background:#05070b;border:1px solid #253044;border-radius:18px;overflow:hidden;box-shadow:0 25px 80px #0009}canvas{width:100%;height:100%;display:block}.top,.hud{position:absolute;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}.top{top:14px}.hud{bottom:14px;align-items:end}.brand{font-weight:900;letter-spacing:.18em}.brand span{color:var(--cyan)}.objective{padding:8px 12px;border:1px solid #9b364a;background:#080d15cc;color:var(--gold);font-weight:800;border-radius:8px}.card{background:#080d15dd;border:1px solid #273347;border-radius:13px;padding:11px 13px;backdrop-filter:blur(8px);min-width:220px}.label{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.big{font-size:25px;font-weight:900}.ammo{color:var(--gold)}.meter{height:6px;background:#1c2533;border-radius:99px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#fff);width:100%}.help{font-size:11px;color:#a7b4c5;line-height:1.5}.feed{position:absolute;top:74px;right:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:6}.feed div{font-size:11px;background:#070b12dd;border:1px solid #273347;border-radius:8px;padding:5px 10px}.start{position:absolute;inset:0;display:grid;place-items:center;background:#05070bcc;z-index:10}.startbox{text-align:center;max-width:560px;padding:32px}.start h1{font-size:clamp(42px,8vw,86px);line-height:.9;margin:0 0 10px;letter-spacing:-.06em}.start h1 span{color:var(--cyan)}button{cursor:pointer;border:0;border-radius:10px;padding:13px 24px;background:var(--cyan);font-weight:900;color:#021017;font-size:15px}button:hover{filter:brightness(1.1)}
</style></head><body><div id="wrap"><div class="shell"><canvas id="game"></canvas><div class="top"><div class="brand">ARENA <span>STRIKE</span> // 5V5</div><div class="objective">FIRST TO 25 ELIMS</div></div><div class="feed" id="feed"></div><div class="hud"><div class="card"><div class="label">Health</div><div class="big" id="hp">100</div><div class="meter"><i id="hpbar"></i></div></div><div class="card" style="text-align:right"><div class="label">Rifle · <span id="weapon">AR-9</span></div><div class="big ammo" id="ammo">30 / 120</div><div class="help">WASD move · Mouse aim · Click fire · R reload · 1/2 weapons</div></div></div><div class="start" id="start"><div class="startbox"><div class="label">TACTICAL ARENA</div><h1>ARENA<br><span>STRIKE</span></h1><p>5v5 browser combat prototype. Your squad fights alongside you against an AI enemy team.</p><button id="play">DEPLOY</button></div></div></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),shell=document.querySelector('.shell');let W,H,D=1;function resize(){D=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:W/2,y:H/2,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload();if(e.key==='1')equip(0);if(e.key==='2')equip(1)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
let player,enemies,allies,bullets,score=[0,0],running=false,over=false,shots=0,weapon=0,last=0,spawn=0;const guns=[{name:'AR-9',mag:30,res:120,dmg:20,rate:105,speed:820},{name:'SMG-12',mag:45,res:180,dmg:12,rate:65,speed:900}];let gun=guns[0];
function unit(x,y,team,bot=false){return{x,y,team,bot,hp:100,max:100,r:13,angle:0,mag:team===0?gun.mag:30,res:team===0?gun.res:120,cool:0,reload:0,dead:false,respawn:0,strafe:Math.random()*6.28,target:null}}
function reset(){score=[0,0];bullets=[];player=unit(W*.2,H*.5,0);allies=[...Array(4)].map((_,i)=>unit(W*.16+Math.random()*55,H*.25+i*90,0,true));enemies=[...Array(5)].map((_,i)=>unit(W*.78+Math.random()*60,H*.18+i*105,1,true));running=true;over=false;feed('MATCH STARTED','cyan');document.getElementById('start').style.display='none'}
function equip(i){if(weapon===i)return;weapon=i;gun=guns[i];player.mag=Math.min(gun.mag,player.mag);player.res=gun.res;document.getElementById('weapon').textContent=gun.name}
function reload(){if(!running||player.reload||player.mag===gun.mag||player.res<=0)return;player.reload=800}
function shoot(u){if(u.dead||u.reload||u.cool>0||u.mag<=0)return;if(u===player){u.cool=gun.rate}else u.cool=150;u.mag--;let spread=u===player?.035:.12,a=u.angle+(Math.random()-.5)*spread;bullets.push({x:u.x+Math.cos(a)*15,y:u.y+Math.sin(a)*15,vx:Math.cos(a)*(u===player?gun.speed:650),vy:Math.sin(a)*(u===player?gun.speed:650),team:u.team,dmg:u===player?gun.dmg:14,life:900});if(u===player&&u.mag===0)reload()}
function nearest(u){let arr=u.team===0?enemies: [player,...allies.filter(a=>!a.dead)];let best=null,bd=1e9;for(const v of arr)if(!v.dead){let d=(v.x-u.x)**2+(v.y-u.y)**2;if(d<bd){bd=d;best=v}}return best}
function damage(v,dmg,killer){v.hp-=dmg;if(v.hp<=0){v.dead=true;v.respawn=1600;score[killer.team]++;feed((killer===player?'YOU':'ALLY')+' ELIMINATED '+(v.team?'RED':'BLUE'),'cyan');if(score[0]>=25||score[1]>=25){over=true;running=false;document.getElementById('start').style.display='grid';document.querySelector('.startbox').innerHTML='<div class="label">MATCH COMPLETE</div><h1>'+ (score[0]>score[1]?'VICTORY':'DEFEAT')+'</h1><p>BLUE '+score[0]+' — RED '+score[1]+'</p><button onclick="reset()">REMATCH</button>'}}}
function respawn(u){u.dead=false;u.hp=100;u.x=u.team?W*.78:W*.22;u.y=H*.25+Math.random()*(H*.5);u.mag=u.team?30:gun.mag}
function feed(t){let d=document.createElement('div');d.textContent=t;document.getElementById('feed').prepend(d);setTimeout(()=>d.remove(),2200)}
function update(dt){if(!running)return;let s=260*dt/1000;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),len=Math.hypot(dx,dy)||1;if(!player.dead){player.x+=dx/len*s;player.y+=dy/len*s;player.x=Math.max(25,Math.min(W-25,player.x));player.y=Math.max(80,Math.min(H-25,player.y));player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);if(mouse.down)shoot(player)}for(const u of [player,...allies,...enemies]){if(u.cool>0)u.cool-=dt;if(u.reload){u.reload-=dt;if(u.reload<=0){let need=(u.team?30:gun.mag)-u.mag,take=Math.min(need,u.res);u.mag+=take;u.res-=take;u.reload=0}}if(u.dead){u.respawn-=dt;if(u.respawn<=0)respawn(u)}}for(const u of [...allies,...enemies]){if(u.dead)continue;let t=nearest(u);if(!t)continue;u.target=t;u.angle=Math.atan2(t.y-u.y,t.x-u.x);let d=Math.hypot(t.x-u.x,t.y-u.y);if(d>260){u.x+=Math.cos(u.angle)*75*dt/1000;u.y+=Math.sin(u.angle)*75*dt/1000}else if(d<150){u.x-=Math.cos(u.angle)*50*dt/1000;u.y-=Math.sin(u.angle)*50*dt/1000}if(d<620)shoot(u)}for(const b of bullets){b.x+=b.vx*dt/1000;b.y+=b.vy*dt/1000;b.life-=dt;for(const v of [player,...allies,...enemies])if(!v.dead&&v.team!==b.team&&Math.hypot(v.x-b.x,v.y-b.y)<v.r+4){damage(v,b.dmg,b.team===0?player:enemies.find(e=>e.team===1&&!e.dead)||enemies[0]);b.life=0;break}}bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>50&&b.y<H+20);document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('hpbar').style.width=Math.max(0,player.hp)+'%';document.getElementById('ammo').textContent=(player.reload?'RELOADING':player.mag+' / '+player.res);document.querySelector('.objective').textContent='BLUE '+score[0]+'  —  RED '+score[1]}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#08101a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#132336';ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,50);ctx.lineTo(x,H);ctx.stroke()}for(let y=50;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#111c29';[[W*.35,H*.2,130,35],[W*.5,H*.52,180,42],[W*.7,H*.25,35,140],[W*.25,H*.72,170,35]].forEach(a=>ctx.fillRect(...a));for(const b of bullets){ctx.strokeStyle=b.team?'#ff6b73':'#4de7ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.012,b.y-b.vy*.012);ctx.stroke()}for(const u of [...allies,...enemies,player]){if(u.dead)continue;ctx.save();ctx.translate(u.x,u.y);ctx.rotate(u.angle);ctx.fillStyle=u.team?'#ff5e69':'#4de7ff';ctx.beginPath();ctx.arc(0,0,u.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dbefff';ctx.fillRect(6,-3,17,6);ctx.restore();ctx.fillStyle='#05070b';ctx.fillRect(u.x-16,u.y-23,32,4);ctx.fillStyle=u.team?'#ff5e69':'#4de7ff';ctx.fillRect(u.x-16,u.y-23,32*Math.max(0,u.hp/100),4)}ctx.fillStyle='#a7b4c5';ctx.font='11px system-ui';ctx.fillText('BLUE SPAWN',18,H-28);ctx.textAlign='right';ctx.fillText('RED SPAWN',W-18,H-28);ctx.textAlign='left'}
function loop(t){let dt=Math.min(40,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}document.getElementById('play').onclick=reset;requestAnimationFrame(loop);
</script></body></html>
